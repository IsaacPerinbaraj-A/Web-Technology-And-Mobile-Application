<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Successful</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #d4fc79, #96e6a1);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 12px;
      width: 400px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      text-align: center;
      animation: fadeIn 0.6s ease-in-out;
    }

    h1 {
      color: #28a745;
      margin-bottom: 10px;
    }

    .icon {
      font-size: 50px;
      color: #28a745;
    }

    .details {
      margin-top: 20px;
      text-align: left;
      font-size: 15px;
    }

    .details p {
      margin: 8px 0;
      border-bottom: 1px solid #eee;
      padding-bottom: 5px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>

<body>

<div class="card">
  <div class="icon">✔</div>
  <h1>Registration Successful</h1>
  <p>Your details have been submitted successfully!</p>

  <div class="details">
    <p><b>First Name:</b> <span id="fname"></span></p>
    <p><b>Last Name:</b> <span id="lname"></span></p>
    <p><b>Email:</b> <span id="email"></span></p>
    <p><b>Mobile:</b> <span id="mobile"></span></p>
    <p><b>Address:</b> <span id="address"></span></p>
  </div>

  <button onclick="goBack()">Back to Form</button>
</div>

<script>
  document.getElementById("fname").innerText = localStorage.getItem("fname");
  document.getElementById("lname").innerText = localStorage.getItem("lname");
  document.getElementById("email").innerText = localStorage.getItem("email");
  document.getElementById("mobile").innerText = localStorage.getItem("mobile");
  document.getElementById("address").innerText = localStorage.getItem("address");

  function goBack() {
    localStorage.clear(); // optional: clear data after showing
    window.location.href = "register.html";
  }
</script>

</body>
</html>
